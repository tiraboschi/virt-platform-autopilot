# Framework-level maturity. The autopilot is GA: enabled by default (opt-out via
# platform.kubevirt.io/autopilot=false), so no opt_in gate is declared.
framework:
  maturity: ga

# Feature catalog: maps user-facing features to assets/groups.
# - maturity is required only for opt-in features ("dp" or "tp")
# - features whose assets are all install: always are auto-classified as GA
# - opt-in conditions are derived from the referenced assets (no duplication)
# - every asset must be covered by a feature entry or listed in excluded_assets

# Assets intentionally excluded from feature tracking (e.g. internal-only,
# not yet user-facing, or managed externally).
excluded_assets:
  - hco-golden-config
  - status-service

features:
  - name: Swap Enablement
    description: Enables OpenShift worker nodes to safely use swap for virtualization workloads; swap requires pre-provisioned dedicated storage to be available
    assets: [swap-enable]

  - name: File-based Swap Provisioning
    description: Optional cheaper alternative to a dedicated swap partition; provisions file-backed swap sized to each worker's memory overcommitment, skipped on workers that have the dedicated partition. Swap activation remains managed by Swap Enablement
    maturity: dp
    assets: [file-based-swap-provisioning]

  - name: Kubelet Performance
    description: >-
      Optimized kubelet settings for virtualization workloads. Does not
      require node reboot; restarts kubelet.
    maturity: tp
    assets:
      - kubelet-perf-settings-node-disruption-policy
      - kubelet-perf-settings

  - name: Observability Enhancements
    description: Enhanced observability with additional Prometheus alerting rules and advanced Perses dashboards in the OpenShift console
    assets: [metrics-service, metrics-servicemonitor, prometheus-alerts, monitoring-ui-plugin, autopilot-dashboard]
    requires:
      - Cluster Observability Operator

  - name: Load-Aware Descheduler
    description: Load-aware VM balancing based on CPU/memory utilization and pressure stall metrics
    assets: [descheduler-loadaware, psi-enable, psi-enable-master, descheduler-dashboard]
    requires:
      - Kube Descheduler Operator

  - name: PCI Passthrough
    description: GPU/PCI device passthrough via VFIO
    maturity: dp
    assets: [pci-passthrough]

  - name: CPU Manager
    description: >-
      Dedicated CPU pinning for guaranteed QoS workloads. Does not require
      node reboot; drains the node, restarts kubelet.
    maturity: dp
    assets:
      - kubelet-cpu-manager-node-disruption-policy
      - kubelet-cpu-manager

  - name: SCSI Persistent Reservations
    description: >-
      Configures worker-node multipath to persist SCSI persistent-reservation
      keys for VMs sharing LUN-backed disks. Does not require node reboot.
      Requires an existing /etc/multipath.conf so multipathd is active before
      enable.
    maturity: dp
    assets:
      - scsi-persistent-reservations-node-disruption-policy
      - scsi-persistent-reservations
      - scsi-persistent-reservations-master

  - name: MTV Operator
    description: Migration Toolkit for Virtualization
    maturity: dp
    assets: [mtv-operator]

  - name: MetalLB Operator
    description: Bare-metal load balancer for services
    maturity: dp
    assets: [metallb-operator]

  - name: Logging
    description: Integrated logging stack with LokiStack and ClusterLogForwarder
    maturity: dp
    groups: [logging, audit-logging]
    requires:
      - Loki Operator
      - Red Hat OpenShift Logging Operator

  - name: Incident Detection
    description: >-
      OpenShift Incident Detection groups related cluster alerts into a single, cohesive
      timeline to eliminate alert fatigue and speed up troubleshooting.
    assets: [monitoring-ui-plugin]
    requires:
      - Cluster Observability Operator

  - name: Troubleshooting Panel
    description: Korrel8r observability signal correlation in the console
    assets: [troubleshooting-panel-ui-plugin]
    requires:
      - Cluster Observability Operator

  - name: KubeVirt Metrics Exporter
    description: Per-node VM storage I/O latency collection via QMP, QGA, and eBPF, and detailed KVM and memory statistics
    maturity: dp
    groups: [kubevirt-metrics-exporter]
    recommended:
      - Cluster Observability Operator

  - name: In-Flight Operations
    description: OperationRuleSet-based coordination for safe concurrent operations
    maturity: tp
    groups: [inflightoperations]

  - name: Kernel Samepage Merging (KSM) zero pages only
    description: >-
      Node-level KSM zero-pages-only deduplication with adaptive scan rate and
      max_ptes_none=0 when KSM is active. Standalone for memory savings on Windows
      VM workers; recommend thp-tuning on the same nodes for THP performance.
      KSM tuner updates restart only the tuner service through an MCO Node
      Disruption Policy, avoiding a node reboot.
    maturity: dp
    groups: [ksm-zero-only]

  - name: Transparent Huge Pages (THP) Tuning
    description: >-
      Node-level THP madvise/defrag/shmem tuning, shrink_underused=0 on
      kernels that support it, khugepaged scan rates, and max_ptes_none
      coordination with KSM. Does not require node reboot. Optional
      sub-feature: enable-thp-tuning-kernelcore sets kernelcore=2G and
      movablecore=97% (max(2G, 3% MemTotal) ZONE_MOVABLE split per node);
      requires reboot.
    maturity: dp
    groups: [thp-tuning]

  - name: NHC with FAR remediator and SBR detection-mode config
    description: Node health checks with fence-agents remediation and storage-based remediation in detection-only mode
    maturity: dp
    assets: [nhc-far, sbr-detection-config]
    requires:
      - Node Health Check Operator
      - Fence Agents Remediation Operator
      - Storage Based Remediation Operator

  - name: VM drain shutdown inhibitor
    description: >-
      Attempts to gracefully shutdown KubeVirt VMs before allowing the
      node to shut down. Does not require node reboot.
    maturity: dp
    assets:
      - vm-drain-shutdown-inhibitor-node-disruption-policy
      - vm-drain-shutdown-inhibitor
      - vm-drain-shutdown-inhibitor-master
