# Asset catalog defining what to manage
# CRITICAL: HCO must be first - it's applied first, then read for RenderContext
assets:
  # Phase 0: HCO Golden Reference (Always, managed first!)
  - name: hco-golden-config
    path: active/hco/golden-config.yaml.tpl
    phase: 0
    install: always
    component: HyperConverged
    reconcile_order: 0
    conditions: []

  # Phase 1: Observability - metrics Service, ServiceMonitor, and PrometheusRule for alerts
  # Soft dependency: ServiceMonitor and PrometheusRule will be skipped gracefully
  # if Prometheus Operator CRD is not installed
  - name: metrics-service
    path: active/observability/metrics-service.yaml.tpl
    phase: 1
    install: always
    component: Service
    reconcile_order: 1
    conditions: []

  - name: status-service
    path: active/observability/status-service.yaml.tpl
    phase: 1
    install: always
    component: Service
    reconcile_order: 1
    conditions: []

  - name: metrics-servicemonitor
    path: active/observability/servicemonitor.yaml.tpl
    phase: 1
    install: always
    component: ServiceMonitor
    reconcile_order: 1
    conditions: []

  - name: prometheus-alerts
    path: active/observability/prometheus-rules.yaml.tpl
    phase: 1
    install: always
    component: PrometheusRule
    reconcile_order: 1
    conditions: []

  - name: autopilot-dashboard
    path: active/observability/autopilot-dashboard.yaml.tpl
    phase: 1
    install: always
    component: PersesDashboard
    reconcile_order: 1
    conditions: []

  # Phase 1: Descheduler memory-aware rebalancing dashboard.
  # Auto-enabled when both the Perses (auto-detected) and Descheduler CRDs are present;
  # all panels query descheduler recording rules, so it is gated on the Descheduler CRD.
  - name: descheduler-dashboard
    group: descheduler-loadaware
    gate_crd: kubedeschedulers.operator.openshift.io
    path: active/observability/descheduler-dashboard.yaml.tpl
    phase: 1
    install: always
    component: PersesDashboard
    reconcile_order: 1
    conditions: []

  # Phase 1: MachineConfig (requires MachineConfig CRD)
  - name: swap-enable
    path: active/machine-config/01-swap-enable.yaml.tpl
    phase: 1
    install: always
    component: MachineConfig
    reconcile_order: 1
    conditions: []

  # Phase 1: Opt-in - provisions file-backed swap. The always-on swap-enable
  # asset owns activation, avoiding concurrent swapon calls during boot.
  - name: file-based-swap-provisioning
    path: active/machine-config/09-file-based-swap-provisioning.yaml.tpl
    phase: 1
    install: opt-in
    component: MachineConfig
    reconcile_order: 1
    conditions:
      - type: annotation
        key: platform.kubevirt.io/enable-file-based-swap-provisioning
        value: "true"

  - name: pci-passthrough
    path: active/machine-config/02-pci-passthrough.yaml.tpl
    phase: 1
    install: opt-in
    component: MachineConfig
    reconcile_order: 1
    conditions:
      - type: annotation
        key: platform.kubevirt.io/openshift
        value: "true"
      - type: hardware-detection
        detector: pciDevicesPresent
      - type: annotation
        key: platform.kubevirt.io/enable-pci-passthrough
        value: "true"

  # Enabling PSI sets the psi=1 kernel argument, which requires a rolling
  # reboot. It is intentionally NOT gated on the Descheduler CRD: gating it
  # would defer the reboot to whenever an admin later installs the Kube
  # Descheduler Operator, causing a surprise day-2 node reboot. Instead PSI is
  # always deployed so the reboot is absorbed during the platform upgrade the
  # admin already expects. PSI metrics are broadly useful (and prerequisite to
  # the load-aware descheduler), so enabling them unconditionally is cheap.
  - name: psi-enable
    group: descheduler-loadaware
    path: active/machine-config/04-psi-enable.yaml.tpl
    phase: 1
    install: always
    component: MachineConfig
    reconcile_order: 1
    template_params:
      role: worker

  - name: psi-enable-master
    group: descheduler-loadaware
    path: active/machine-config/04-psi-enable.yaml.tpl
    phase: 1
    install: always
    component: MachineConfig
    reconcile_order: 1
    template_params:
      role: master
    conditions:
      - type: topology
        field: hasSchedulableMasters

  # Must be reconciled before the KSM MachineConfigs so MCO has their
  # rebootless update policy before it sees the bypassed MachineConfigs.
  - name: ksm-zero-only-node-disruption-policy
    group: ksm-zero-only
    path: active/machine-config/05-ksm-zero-only-node-disruption-policy.yaml
    phase: 1
    install: opt-in
    component: MachineConfiguration
    reconcile_order: 1
  - name: ksm-zero-only
    group: ksm-zero-only
    path: active/machine-config/05-ksm-zero-only.yaml.tpl
    phase: 1
    install: opt-in
    component: MachineConfig
    reconcile_order: 2
    node_disruption_policy:
      asset: ksm-zero-only-node-disruption-policy
    template_params:
      role: worker
    conditions: &ksm-zero-only-conditions
      - type: annotation
        key: platform.kubevirt.io/enable-ksm-zero-only
        value: "true"
      - type: hco-field-unconfigured
        path: spec.virtualization.ksmConfiguration

  - name: ksm-zero-only-master
    group: ksm-zero-only
    path: active/machine-config/05-ksm-zero-only.yaml.tpl
    phase: 1
    install: opt-in
    component: MachineConfig
    reconcile_order: 2
    node_disruption_policy:
      asset: ksm-zero-only-node-disruption-policy
    template_params:
      role: master
    conditions:
      - type: annotation
        key: platform.kubevirt.io/enable-ksm-zero-only
        value: "true"
      - type: hco-field-unconfigured
        path: spec.virtualization.ksmConfiguration
      - type: topology
        field: hasSchedulableMasters

  - name: ksm-cluster-monitoring
    group: ksm-zero-only
    path: active/monitoring/cluster-monitoring-ksm.yaml.tpl
    phase: 1
    install: opt-in
    component: ConfigMap
    reconcile_order: 2
    conditions: *ksm-zero-only-conditions

  - name: thp-tuning-node-disruption-policy
    group: thp-tuning
    path: active/machine-config/06-thp-tuning-node-disruption-policy.yaml
    phase: 1
    install: opt-in
    component: MachineConfiguration
    reconcile_order: 1
  - name: thp-tuning
    group: thp-tuning
    path: active/machine-config/06-thp-tuning.yaml.tpl
    phase: 1
    install: opt-in
    component: MachineConfig
    reconcile_order: 2
    node_disruption_policy:
      asset: thp-tuning-node-disruption-policy
    template_params:
      role: worker
    conditions:
      - type: annotation
        key: platform.kubevirt.io/enable-thp-tuning
        value: "true"

  - name: thp-tuning-master
    group: thp-tuning
    path: active/machine-config/06-thp-tuning.yaml.tpl
    phase: 1
    install: opt-in
    component: MachineConfig
    reconcile_order: 2
    node_disruption_policy:
      asset: thp-tuning-node-disruption-policy
    template_params:
      role: master
    conditions:
      - type: annotation
        key: platform.kubevirt.io/enable-thp-tuning
        value: "true"
      - type: topology
        field: hasSchedulableMasters

  - name: thp-tuning-kernelcore
    group: thp-tuning
    path: active/machine-config/06-thp-tuning-kernelcore.yaml.tpl
    phase: 1
    install: opt-in
    component: MachineConfig
    reconcile_order: 2
    template_params:
      role: worker
    conditions:
      - type: annotation
        key: platform.kubevirt.io/enable-thp-tuning-kernelcore
        value: "true"

  - name: thp-tuning-kernelcore-master
    group: thp-tuning
    path: active/machine-config/06-thp-tuning-kernelcore.yaml.tpl
    phase: 1
    install: opt-in
    component: MachineConfig
    reconcile_order: 2
    template_params:
      role: master
    conditions:
      - type: annotation
        key: platform.kubevirt.io/enable-thp-tuning-kernelcore
        value: "true"
      - type: topology
        field: hasSchedulableMasters

  # Phase 1: OpenShift Kubelet (MachineConfig dropping files to /etc/openshift/kubelet.conf.d)
  - name: kubelet-perf-settings-node-disruption-policy
    path: active/machine-config/03-kubelet-perf-settings-node-disruption-policy.yaml
    phase: 1
    install: opt-in
    component: MachineConfiguration
    reconcile_order: 1
  - name: kubelet-perf-settings
    path: active/machine-config/03-kubelet-perf-settings.yaml.tpl
    phase: 1
    install: opt-in
    component: MachineConfig
    reconcile_order: 2
    node_disruption_policy:
      asset: kubelet-perf-settings-node-disruption-policy
    conditions:
      - type: annotation
        key: platform.kubevirt.io/enable-kubelet-performance-settings
        value: "true"

  # Phase 1: Optional Operators (opt-in for clusters with CRDs)
  - name: mtv-operator
    path: active/operators/mtv.yaml.tpl
    phase: 1
    install: opt-in
    component: ForkliftController
    reconcile_order: 1
    conditions:
      - type: annotation
        key: platform.kubevirt.io/enable-mtv
        value: "true"

  - name: metallb-operator
    path: active/operators/metallb.yaml.tpl
    phase: 1
    install: opt-in
    component: MetalLB
    reconcile_order: 1
    conditions:
      - type: annotation
        key: platform.kubevirt.io/enable-metallb
        value: "true"

  # Phase 1: Monitoring UI Plugin - enables Perses and incident detection in the
  # OpenShift console (COO). Soft dependency: skipped if COO
  # (uiplugins.observability.openshift.io CRD) is absent.
  # When ACM is present it manages the same 'monitoring' UIPlugin and adds acm.*
  # fields; SSA field managers don't conflict because autopilot owns
  # spec.monitoring.perses and spec.monitoring.incidents in a single apply.
  # Both fields live in this asset: a second apply of the same object with the
  # shared field manager would drop incidents and trigger anti-thrashing.
  - name: monitoring-ui-plugin
    path: active/operators/monitoring-uiplugin.yaml.tpl
    phase: 1
    install: always
    component: UIPlugin
    reconcile_order: 1
    conditions: []

  # Phase 1: Troubleshooting Panel (korrel8r) - enables observability signal correlation.
  # Provides a side-panel in the console that links metrics, logs, alerts, traces,
  # and Kubernetes resources for cross-signal navigation.
  # Soft dependency: skipped if COO (uiplugins.observability.openshift.io CRD) is absent.
  - name: troubleshooting-panel-ui-plugin
    path: active/operators/troubleshooting-panel-uiplugin.yaml
    phase: 1
    install: always
    component: UIPlugin
    reconcile_order: 1
    conditions: []

  # Phase 1: Logging stack - configures LokiStack, ClusterLogForwarder,
  # and Logging UI Plugin.
  # Opt-in: requires annotation. Prerequisites:
  #   1. Install Loki Operator and Red Hat OpenShift Logging Operator (via OLM)
  #   2. Create storage secret (logging-loki-storage) in openshift-logging
  # LokiStack size is dynamic based on cluster topology (pico/extra-small/medium).
  # Grouped under "logging" for selective allowlist activation.
  #
  # Audit log collection is separately opt-in via:
  #   platform.kubevirt.io/enable-audit-logging=true
  # When enabled, the ClusterLogForwarder adds an audit pipeline with production
  # filters that reduce volume by ~95% (drop non-complete stages, system users,
  # and noisy verbs like watch/proxy).
  - name: logging-lokistack
    group: logging
    gate_crd: lokistacks.loki.grafana.com
    path: active/logging/lokistack.yaml.tpl
    phase: 1
    install: opt-in
    component: LokiStack
    reconcile_order: 2
    conditions:
      - type: annotation
        key: platform.kubevirt.io/enable-logging
        value: "true"

  - name: logging-collector-sa
    group: logging
    path: active/logging/collector-sa.yaml
    phase: 1
    install: opt-in
    component: ServiceAccount
    reconcile_order: 2
    conditions:
      - type: annotation
        key: platform.kubevirt.io/enable-logging
        value: "true"

  - name: logging-collector-crb-application
    group: logging
    # These bindings reference ClusterRoles installed by the OpenShift Logging
    # Operator. Skip them until the operator CRD is available so a missing
    # optional logging stack is reported as a dependency, not an apply failure.
    gate_crd: clusterlogforwarders.observability.openshift.io
    path: active/logging/collector-crb-application.yaml
    phase: 1
    install: opt-in
    component: ClusterRoleBinding
    reconcile_order: 2
    conditions:
      - type: annotation
        key: platform.kubevirt.io/enable-logging
        value: "true"

  - name: logging-collector-crb-infrastructure
    group: logging
    gate_crd: clusterlogforwarders.observability.openshift.io
    path: active/logging/collector-crb-infrastructure.yaml
    phase: 1
    install: opt-in
    component: ClusterRoleBinding
    reconcile_order: 2
    conditions:
      - type: annotation
        key: platform.kubevirt.io/enable-logging
        value: "true"

  - name: logging-collector-crb-writer
    group: logging
    gate_crd: clusterlogforwarders.observability.openshift.io
    path: active/logging/collector-crb-writer.yaml
    phase: 1
    install: opt-in
    component: ClusterRoleBinding
    reconcile_order: 2
    conditions:
      - type: annotation
        key: platform.kubevirt.io/enable-logging
        value: "true"

  - name: logging-collector-crb-audit
    group: audit-logging
    gate_crd: clusterlogforwarders.observability.openshift.io
    path: active/logging/collector-crb-audit.yaml
    phase: 1
    install: opt-in
    component: ClusterRoleBinding
    reconcile_order: 2
    conditions:
      - type: annotation
        key: platform.kubevirt.io/enable-audit-logging
        value: "true"

  - name: logging-collector
    group: logging
    gate_crd: clusterlogforwarders.observability.openshift.io
    path: active/logging/clusterlogforwarder.yaml.tpl
    phase: 1
    install: opt-in
    component: ClusterLogForwarder
    reconcile_order: 3
    conditions:
      - type: annotation
        key: platform.kubevirt.io/enable-logging
        value: "true"

  - name: logging-ui-plugin
    group: logging
    path: active/operators/logging-uiplugin.yaml
    phase: 1
    install: opt-in
    component: UIPlugin
    reconcile_order: 3
    conditions:
      - type: annotation
        key: platform.kubevirt.io/enable-logging
        value: "true"

  # Phase 1: Auto-enabled when Descheduler CRD is present (soft dependency)
  - name: descheduler-loadaware
    path: active/descheduler/recommended.yaml.tpl
    phase: 1
    install: always
    component: KubeDescheduler
    reconcile_order: 1
    conditions: []

  # Phase 1: Opt-in - CPU Manager
  # Gated on BOTH the KubeVirt CPUManager feature gate (VM CPU pinning) AND an
  # explicit opt-in annotation: these kubelet perf tunings change node-level
  # reserved resources and require deliberate opt-in (see CNV-96059).
  - name: kubelet-cpu-manager-node-disruption-policy
    path: active/machine-config/07-kubelet-cpu-manager-node-disruption-policy.yaml
    phase: 1
    install: opt-in
    component: MachineConfiguration
    reconcile_order: 1
  - name: kubelet-cpu-manager
    path: active/machine-config/07-kubelet-cpu-manager.yaml.tpl
    phase: 1
    install: opt-in
    component: MachineConfig
    reconcile_order: 2
    node_disruption_policy:
      asset: kubelet-cpu-manager-node-disruption-policy
    conditions:
      - type: kubevirt-feature-gate
        value: CPUManager
      - type: annotation
        key: platform.kubevirt.io/enable-cpu-manager-perf-tunings
        value: "true"

  # Phase 1: Opt-in - configures multipath to persist SCSI PR keys in a file
  # on every worker that can host VMs using shared LUNs.
  # Hard requirement: /etc/multipath.conf must already exist so multipathd can
  # start; NDP Reload fails if the unit is inactive (see docs/scsi-persistent-reservations.md).
  - name: scsi-persistent-reservations-node-disruption-policy
    path: active/machine-config/08-scsi-persistent-reservations-node-disruption-policy.yaml
    phase: 1
    install: opt-in
    component: MachineConfiguration
    reconcile_order: 1
  - name: scsi-persistent-reservations
    path: active/machine-config/08-scsi-persistent-reservations.yaml.tpl
    phase: 1
    install: opt-in
    component: MachineConfig
    reconcile_order: 2
    node_disruption_policy:
      asset: scsi-persistent-reservations-node-disruption-policy
    template_params:
      role: worker
    conditions:
      - type: annotation
        key: platform.kubevirt.io/enable-scsi-persistent-reservations
        value: "true"

  - name: scsi-persistent-reservations-master
    path: active/machine-config/08-scsi-persistent-reservations.yaml.tpl
    phase: 1
    install: opt-in
    component: MachineConfig
    reconcile_order: 2
    node_disruption_policy:
      asset: scsi-persistent-reservations-node-disruption-policy
    template_params:
      role: master
    conditions:
      - type: annotation
        key: platform.kubevirt.io/enable-scsi-persistent-reservations
        value: "true"
      - type: topology
        field: hasSchedulableMasters

